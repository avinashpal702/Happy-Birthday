<h2>⏳ Countdown to Our Future 💍</h2>
<p id="countdown"></p>
<script>
  const targetDate = new Date("2027-08-22"); // her next birthday
  function updateCountdown() {
    const now = new Date();
    const diff = targetDate - now;
    const days = Math.floor(diff / (1000*60*60*24));
    document.getElementById("countdown").innerText = 
      "Only " + days + " days until your next birthday 🎉💖";
  }
  setInterval(updateCountdown, 1000);
</script>
